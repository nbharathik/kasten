name: Website

# Publishes the website and the browser demo to GitHub Pages: site/ at the
# root and the app's browser preview under demo/. Release tags publish both;
# site-v* tags publish only the website, without building installers. It can
# also be started by hand. Pages must deploy from GitHub Actions in settings.
on:
  push:
    tags: ["v*", "site-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.6.0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Test the website build and workflow setup
        run: node --test scripts/build-site.test.mjs scripts/workflows.test.mjs
      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      # The demo's Settings → About lists the same licences as the app.
      - name: Write the third-party notices
        run: node scripts/notices.mjs
      - name: Build the website and the demo
        run: node scripts/build-site.mjs "$GITHUB_REPOSITORY" "$SITE"
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
